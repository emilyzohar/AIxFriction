<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fraction Demand Selection Task</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --good: #047857;
      --bad: #b91c1c;
      --button: #111827;
      --buttonText: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    .shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 18px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 750;
    }

    #subheader {
      font-size: 14px;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .notice {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin: 14px 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .btn {
      appearance: none;
      border: 0;
      background: var(--button);
      color: var(--buttonText);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .btn.secondary {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn.large {
      min-width: 230px;
      min-height: 72px;
      font-size: 18px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .input {
      width: min(420px, 100%);
      font-size: 20px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .small { font-size: 14px; }
    .muted { color: var(--muted); }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .hr { height: 1px; background: var(--border); margin: 16px 0; }

    .math {
      font-size: 34px;
      line-height: 1.5;
      margin: 10px 0;
    }

    .frac sup { font-size: .72em; vertical-align: .45em; }
    .frac sub { font-size: .72em; vertical-align: -.15em; }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      background: #fff;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 14px;
    }

    .choiceGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .choiceCard {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0;
  background: #fff;
  overflow: hidden;
  min-height: 220px;
}

.choiceButton {
  width: 100%;
  height: 100%;
  min-height: 220px;
  border: none;
  background: transparent;
  font-size: 24px;
  font-weight: 700;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}
.completeButton {
  background: #d93025;
  color: white;
}

.completeButton:hover {
  background: #b3261e;
}

.answerButton {
  background: #1a73e8;
  color: white;
}

.answerButton:hover {
  background: #1558b0;
}


    .choiceTitle {
      font-weight: 750;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .notepad-panel-fixed {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 290px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 6px 22px rgba(0,0,0,.12);
      z-index: 10;
    }

    .notepad {
      width: calc(100% - 22px);
      min-height: 110px;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.35;
      padding: 9px 10px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .calc-key {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 8px 0;
      font-weight: 650;
      cursor: pointer;
    }

    .calc-input {
      width: calc(100% - 24px);
      font-size: 16px;
      padding: 8px 10px;
      margin-top: 8px;
    }

    .calc-result {
      min-height: 24px;
      font-size: 18px;
      margin-top: 4px;
    }


    .scaffold-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    .scaffold-table th, .scaffold-table td {
      border: 1px solid var(--border);
      padding: 8px;
      vertical-align: top;
    }
    .scaffold-table th {
      text-align: left;
      background: #f3f4f6;
    }
    .scaffold-input {
      width: calc(100% - 18px);
      min-height: 34px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }

    .step-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: #f9fafb;
      margin-top: 10px;
    }
    .step-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      cursor: grab;
      user-select: none;
    }
    .step-card:active { cursor: grabbing; }
    .step-slot {
      min-height: 42px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 5px;
      background: #fff;
    }
    .step-slot.drag-over, .step-bank.drag-over {
      outline: 2px solid #6b7280;
      outline-offset: 1px;
    }

    .likert-scale {
      display: grid;
      grid-template-columns: repeat(7, minmax(42px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }
    .likert-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .likert-option input { width: 20px; height: 20px; }
    .likert-option span { font-weight: 650; }
    .likert-anchors {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .notepad-panel-fixed {
        position: static;
        width: auto;
        margin-top: 18px;
      }
      .math { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <h1>Fraction Study</h1>
      <div id="subheader"></div>
    </div>
    <main id="content" class="card"></main>
    <div class="footer">
      <div id="leftFooter"></div>
      <div id="rightFooter"></div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ============================================================
  // CONFIG: EDIT THESE BEFORE LAUNCHING
  // ============================================================
  const CONFIG = {
     experimentID: "1Owm0RGeMQyL", // DataPipe experiment ID
    // Replace with the completion URL supplied by Prolific (normally ends in ?cc=XXXXXXX).
    completionRedirectURL: "https://app.prolific.com/submissions/complete?cc=C1FUTHEC",
    totalStudyMs: 35 * 60 * 1000,
    practicePhaseMs: 10 * 60 * 1000,
    minimumPracticeProblems: 3,
    mainTaskTrials: 10,
    guidedScaffoldTrials: 3,
    feedbackMs: 700,
    revealAnswerMs: 1200,
    allowMixedNumbers: true,
    downloadCSVOnPipeFailure: true
  };

  // ============================================================
  // STATE
  // ============================================================
  const state = {
    participantId: null,
    startedAtISO: null,
    phase: null,
    events: [],
    practiceRows: [],
    dstChoiceRows: [],
    dstPerformanceRows: [],
    selectedPracticeProblems: [],
    selectedDSTProblems: [],
    consent: null,
    practiceRatings: null,
    taskStartedAtMs: null,
    taskDeadlineMs: null,
    practiceDeadlineMs: null,
    timeoutHandle: null,
    ended: false,
    saving: false,
    notepadText: "",
    notepadHistory: [],
    calculatorHistory: [],
    currentCalculatorEntries: [],
    currentCalculatorContext: null,
    practiceCondition: null,
    practiceConditionNumber: null,
    practiceConditionSource: null,
    practiceConditionError: null,
    _eventIndex: 0
  };


  window.addEventListener("beforeunload", e => {
  if (state.taskStartedAtMs !== null && !state.ended) {
    e.preventDefault();
    e.returnValue = "";
  }
});
  // ============================================================
  // BASIC HELPERS
  // ============================================================
  function collectURLParams() {
    const combined = new Map();

    function addParams(raw) {
      if (!raw) return;
      let text = String(raw).replace(/^[?#]/, "");

      // Qualtrics or another redirect layer may encode the entire query string.
      // Decode up to twice, stopping when decoding no longer changes the text.
      for (let i = 0; i < 2; i++) {
        try {
          const decoded = decodeURIComponent(text);
          if (decoded === text) break;
          text = decoded;
        } catch (_) {
          break;
        }
      }

      const params = new URLSearchParams(text);
      for (const [key, value] of params.entries()) {
        combined.set(String(key).trim().toLowerCase(), String(value).trim());
      }
    }

    addParams(window.location.search);
    addParams(window.location.hash);

    // Also handle a nested URL/query passed as a single encoded parameter.
    for (const value of Array.from(combined.values())) {
      if (value.includes("PROLIFIC_PID=") || value.includes("prolific_pid=")) {
        const nestedQuery = value.includes("?") ? value.split("?").slice(1).join("?") : value;
        addParams(nestedQuery);
      }
    }

    return combined;
  }

  function getParam(params, ...names) {
    for (const name of names) {
      const value = params.get(String(name).toLowerCase());
      if (value !== undefined && value !== null && value !== "") return value;
    }
    return "";
  }

  function getURLParams() {
    const params = collectURLParams();
    return {
      participantId: getParam(params, "PROLIFIC_PID", "participantId", "participant_id") || "MISSING_PROLIFIC_PID",
      studyId: getParam(params, "STUDY_ID", "studyId", "study_id"),
      sessionId: getParam(params, "SESSION_ID", "sessionId", "session_id"),
      condition: getParam(params, "condition"),
      receivedParams: Object.fromEntries(params.entries())
    };
  }

  function initStudy() {
    const { participantId, studyId, sessionId, receivedParams } = getURLParams();
    state.participantId = participantId;
    state.studyId = studyId;
    state.sessionId = sessionId;
    state.startedAtISO = new Date().toISOString();
    logEvent("study_page_loaded", {
      participantId,
      studyId,
      sessionId,
      receivedURL: window.location.href,
      receivedParams: JSON.stringify(receivedParams)
    });
  }

  const PRACTICE_CONDITIONS = [
    "solve_practice",
    "answer_exposure",
    "guided_table"
  ];

  function assignPracticeCondition() {
    const { condition: rawCondition } = getURLParams();
    const conditionNumber = Number(rawCondition);

    if (rawCondition === null || String(rawCondition).trim() === "") {
      throw new Error(
        "Missing condition URL parameter. The study URL must include condition=0, condition=1, or condition=2."
      );
    }

    if (!Number.isInteger(conditionNumber) || conditionNumber < 0 || conditionNumber >= PRACTICE_CONDITIONS.length) {
      throw new Error(
        `Invalid condition URL parameter: ${rawCondition}. Use condition=0, condition=1, or condition=2.`
      );
    }

    state.practiceConditionNumber = conditionNumber;
    state.practiceCondition = PRACTICE_CONDITIONS[conditionNumber];
    state.practiceConditionSource = "url_parameter";
    state.practiceConditionError = null;

    logEvent("practice_condition_assigned", {
      practiceConditionNumber: state.practiceConditionNumber,
      practiceCondition: state.practiceCondition,
      practiceConditionSource: state.practiceConditionSource,
      practiceConditionError: ""
    });
  }

  function startTimedStudy() {
    state.taskStartedAtMs = Date.now();
    state.practiceDeadlineMs = state.taskStartedAtMs + CONFIG.practicePhaseMs;
    state.taskDeadlineMs = state.taskStartedAtMs + CONFIG.totalStudyMs;
    logEvent("timed_study_start", {
      totalStudyMs: CONFIG.totalStudyMs,
      practicePhaseMs: CONFIG.practicePhaseMs
    });
    state.timeoutHandle = window.setTimeout(() => {
      // Active trial screens poll studyTimeRemaining() and finish cleanly so
      // the current response/notepad data can be written before saving.
      logEvent("study_time_expired", { elapsedMs: elapsedStudyMs() });
    }, CONFIG.totalStudyMs);
  }

  function elapsedStudyMs() {
    return state.taskStartedAtMs == null ? 0 : Math.max(0, Date.now() - state.taskStartedAtMs);
  }

  function remainingStudyMs() {
    return state.taskDeadlineMs == null ? CONFIG.totalStudyMs : Math.max(0, state.taskDeadlineMs - Date.now());
  }

  function shouldContinuePracticeBlock() {
    if (!studyTimeRemaining()) return false;
    const tenMinutesElapsed = state.practiceDeadlineMs != null && Date.now() >= state.practiceDeadlineMs;
    const minimumCompleted = state.practiceRows.length >= CONFIG.minimumPracticeProblems;
    return !tenMinutesElapsed || !minimumCompleted;
  }

  function studyTimeRemaining() {
    return state.taskDeadlineMs != null && Date.now() < state.taskDeadlineMs && !state.ended;
  }

  function formatClock(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${String(seconds).padStart(2, "0")}`;
  }

  function logEvent(type, payload = {}) {
    state._eventIndex += 1;
    state.events.push({
      kind: "event",
      participantId: state.participantId,
      eventIndex: state._eventIndex,
      timestampISO: new Date().toISOString(),
      type,
      ...payload
    });
  }

  function now() { return performance.now(); }
  function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function shuffledCopy(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escapeHTML(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function html(s) {
    const d = document.createElement("div");
    d.innerHTML = s;
    return d;
  }

  function clearContent() { $("content").innerHTML = ""; }
  function render(node) { clearContent(); $("content").appendChild(node); }
  function setHeader(text) { $("subheader").textContent = text || ""; }
  function setFooter(left = "", right = "") {
    $("leftFooter").textContent = left || "";
    $("rightFooter").textContent = right || "";
  }

  function asciiMathText(s) {
    return String(s ?? "")
      .replace(/−/g, "-")
      .replace(/×/g, "*")
      .replace(/÷/g, "/")
      .replace(/\u00A0/g, " ");
  }

  function excelText(s) {
    const v = String(s ?? "");
    if (v === "") return "";
    return `="${v.replace(/"/g, '""')}"`;
  }

  // ============================================================
  // EXACT FRACTION ARITHMETIC
  // ============================================================
  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b !== 0) {
      const t = b;
      b = a % b;
      a = t;
    }
    return a || 1;
  }

  function frac(n, d = 1) {
    if (d === 0) throw new Error("Zero denominator");
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }

  function add(a, b) { return frac(a.n * b.d + b.n * a.d, a.d * b.d); }
  function sub(a, b) { return frac(a.n * b.d - b.n * a.d, a.d * b.d); }
  function mul(a, b) { return frac(a.n * b.n, a.d * b.d); }
  function div(a, b) { return frac(a.n * b.d, a.d * b.n); }

  function sameFrac(a, b) { return a && b && a.n === b.n && a.d === b.d; }

  function fracText(f) {
    if (!f) return "";
    if (f.d === 1) return String(f.n);
    return `${f.n}/${f.d}`;
  }

  function rawFracHTML(n, d, forceFraction = false) {
    if (d === 1 && !forceFraction) return String(n);
    return `<span class="frac"><sup>${n}</sup>&frasl;<sub>${d}</sub></span>`;
  }

  function fracHTML(f) {
    if (!f) return "";
    if (f.d === 1) return String(f.n);
    return rawFracHTML(f.n, f.d);
  }

  function parseFractionInput(raw) {
    const s = String(raw || "").trim();
    if (!s) return { ok: false, error: "Please enter an answer." };
    if (s.includes(".")) return { ok: false, error: "Decimals are not allowed. Enter a whole number or fraction." };

    if (/^-?\d+$/.test(s)) {
      return { ok: true, value: frac(Number(s), 1), normalized: String(Number(s)) };
    }

    let m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if (m) {
      const n = Number(m[1]);
      const d = Number(m[2]);
      if (d === 0) return { ok: false, error: "The denominator cannot be 0." };
      const f = frac(n, d);
      return { ok: true, value: f, normalized: fracText(f) };
    }

    if (CONFIG.allowMixedNumbers) {
      m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
      if (m) {
        const whole = Number(m[1]);
        const n = Number(m[2]);
        const d = Number(m[3]);
        if (d === 0) return { ok: false, error: "The denominator cannot be 0." };
        const sign = whole < 0 ? -1 : 1;
        const improper = frac(sign * (Math.abs(whole) * d + n), d);
        return { ok: true, value: improper, normalized: fracText(improper) };
      }
    }

    return {
      ok: false,
      error: CONFIG.allowMixedNumbers
        ? "Use a whole number, fraction, or mixed number, such as 2, 3/4, or 1 1/2."
        : "Use a whole number or fraction, such as 2 or 3/4."
    };
  }

  // ============================================================
  // PROBLEM CREATION
  // ============================================================
  function F(n, d) {
    const f = frac(n, d);
    return { f, text: fracText(f), html: fracHTML(f) };
  }

  function opFunc(op) {
    if (op === "+") return add;
    if (op === "-") return sub;
    if (op === "*") return mul;
    if (op === "/") return div;
    throw new Error(`Unknown operator: ${op}`);
  }

  function opHTML(op) {
    if (op === "+") return "+";
    if (op === "-") return "−";
    if (op === "*") return "×";
    if (op === "/") return "÷";
    throw new Error(`Unknown operator: ${op}`);
  }

  function stepObject(stepNumber, left, op, right, result) {
    const leftText = typeof left === "string" ? left : fracText(left);
    const leftHTML = typeof left === "string" ? escapeHTML(left) : fracHTML(left);
    return {
      stepNumber,
      op,
      leftText,
      leftHTML,
      rightText: right.text,
      rightHTML: right.html,
      expressionText: `${leftText} ${op} ${right.text}`,
      expressionHTML: `${leftHTML} ${opHTML(op)} ${right.html}`,
      correctNumerator: result.n,
      correctDenominator: result.d,
      correctText: fracText(result)
    };
  }

  function makeOne(id, difficulty, A, op, B) {
    const a = F(A[0], A[1]);
    const b = F(B[0], B[1]);
    const answer = opFunc(op)(a.f, b.f);
    return {
      id,
      difficulty,
      steps: 1,
      operationSequence: [op],
      expressionText: `${a.text} ${op} ${b.text}`,
      expressionHTML: `${a.html} ${opHTML(op)} ${b.html}`,
      intermediateSteps: [stepObject(1, a.f, op, b, answer)],
      correctNumerator: answer.n,
      correctDenominator: answer.d,
      correctText: fracText(answer)
    };
  }

  function makeTwo(id, difficulty, A, op1, B, op2, C) {
    const a = F(A[0], A[1]);
    const b = F(B[0], B[1]);
    const c = F(C[0], C[1]);
    const mid = opFunc(op1)(a.f, b.f);
    const answer = opFunc(op2)(mid, c.f);
    return {
      id,
      difficulty,
      steps: 2,
      operationSequence: [op1, op2],
      expressionText: `(${a.text} ${op1} ${b.text}) ${op2} ${c.text}`,
      expressionHTML: `(${a.html} ${opHTML(op1)} ${b.html}) ${opHTML(op2)} ${c.html}`,
      intermediateSteps: [
        stepObject(1, a.f, op1, b, mid),
        stepObject(2, mid, op2, c, answer)
      ],
      correctNumerator: answer.n,
      correctDenominator: answer.d,
      correctText: fracText(answer)
    };
  }

  function makeThreeChain(id, difficulty, A, op1, B, op2, C, op3, D) {
    const a = F(A[0], A[1]);
    const b = F(B[0], B[1]);
    const c = F(C[0], C[1]);
    const d = F(D[0], D[1]);
    const mid1 = opFunc(op1)(a.f, b.f);
    const mid2 = opFunc(op2)(mid1, c.f);
    const answer = opFunc(op3)(mid2, d.f);
    return {
      id,
      difficulty,
      steps: 3,
      operationSequence: [op1, op2, op3],
      expressionText: `((${a.text} ${op1} ${b.text}) ${op2} ${c.text}) ${op3} ${d.text}`,
      expressionHTML: `((${a.html} ${opHTML(op1)} ${b.html}) ${opHTML(op2)} ${c.html}) ${opHTML(op3)} ${d.html}`,
      intermediateSteps: [
        stepObject(1, a.f, op1, b, mid1),
        stepObject(2, mid1, op2, c, mid2),

  function checkProblemBank(bank) {
    for (const p of bank) {
      if (p.correctDenominator <= 0) throw new Error(`Bad denominator in ${p.id}`);

  // NOTEPAD + WHOLE-NUMBER CALCULATOR

  function safeCalculatorEval(expr) {
    const cleaned = String(expr || "")
      .replace(/\s/g, "")
      .replace(/×/g, "*")
      .replace(/−/g, "-")
      .trim();

    if (!cleaned) return { ok: false, error: "Enter one calculation." };

    const m = cleaned.match(/^(\d+)([+\-*÷])(\d+)$/);
    if (!m) {
      return { ok: false, error: "Enter one whole-number calculation only, e.g., 7+4 or 20÷5." };
    }

    const left = Number(m[1]);
    const op = m[2];
    const right = Number(m[3]);
    let result;

    if (op === "+") result = left + right;
    if (op === "-") result = left - right;
    if (op === "*") result = left * right;
    if (op === "÷") {
      if (right === 0) return { ok: false, error: "Cannot divide by 0." };
      result = left / right;
    }

    if (!Number.isFinite(result)) return { ok: false, error: "Invalid calculation." };
    return { ok: true, result };
  }

  function recordCalculatorEntry(action, expressionRaw, outcome = {}) {
    const context = state.currentCalculatorContext || {};
    const entry = {
      timestampISO: new Date().toISOString(),
      action,
      phaseName: context.phaseName || state.phase || "",
      trialNumber: context.trialNumber ?? "",
      problemId: context.problemId || "",
      expressionRaw: String(expressionRaw || ""),
      ok: outcome.ok === true ? 1 : outcome.ok === false ? 0 : "",
      result: outcome.ok ? String(outcome.result) : "",
      error: outcome.ok === false ? String(outcome.error || "") : ""
    };
    state.currentCalculatorEntries.push(entry);
    state.calculatorHistory.push(entry);
    logEvent("calculator_action", {
      calculatorAction: entry.action,
      calculatorPhaseName: entry.phaseName,
      calculatorTrialNumber: entry.trialNumber,
      problemId: entry.problemId,
      calculatorExpressionRaw: entry.expressionRaw,
      calculatorOK: entry.ok,
      calculatorResult: entry.result,
      calculatorError: entry.error
    });
  }

  function attachCalculatorHandlers() {
    const calcInput = $("calcInput");
    const calcResult = $("calcResult");
    const calcBtn = $("btnCalc");
    const calcClear = $("btnCalcClear");
    if (!calcInput || !calcResult || !calcBtn || !calcClear) return;

    function calculate() {
      const raw = calcInput.value;
      const out = safeCalculatorEval(raw);
      recordCalculatorEntry("calculate", raw, out);
      if (!out.ok) {
        calcResult.innerHTML = `<span class="bad">${escapeHTML(out.error)}</span>`;
        return;
      }
      calcResult.innerHTML = `<b>${escapeHTML(String(out.result))}</b>`;
    }

    calcBtn.onclick = calculate;
    calcClear.onclick = () => {
      if (calcInput.value !== "") recordCalculatorEntry("clear", calcInput.value);
      calcInput.value = "";
      calcResult.textContent = "";
      calcInput.focus();
    };
    calcInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        calculate();
      }
    });

    document.querySelectorAll("[data-calc-key]").forEach(btn => {
      btn.onclick = () => {
        calcInput.value += btn.getAttribute("data-calc-key");
        calcInput.focus();
      };
    });
  }

      <div class="row"><button id="btnStartDST" class="btn">Continue</button></div>
    `));
    await new Promise(resolve => { $("btnStartDST").onclick = resolve; });
  }

  function restrictAnswerBox(answerBox) {
    answerBox.addEventListener("keydown", e => {
      if (["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab", "Enter", " ", "/", "-"].includes(e.key)) return;
      if (!/^[0-9]$/.test(e.key)) e.preventDefault();
    });
  }

  async function collectFractionAnswer({ problem, phaseLabel, progressLabel, allowReveal = false }) {
    if (!studyTimeRemaining()) return { action: "timeout" };
    setFooter(allowReveal ? "Submit or reveal answer" : "Submit an answer");

    render(html(`
      <div class="row">
        <div class="pill">${escapeHTML(progressLabel)}</div>
      </div>
      <div class="notice">
        <div class="small muted">Calculate:</div>
        <div class="math">${problem.expressionHTML}</div>
      </div>
      <div class="notice">
        <div class="small"><b>Your answer</b></div>
        <input id="answerBox" class="input" autocomplete="off" placeholder="e.g., 3/4 or 2" />
        <div id="answerErr" class="small bad" style="display:none;margin-top:8px"></div>
      </div>
      <div class="row">
        <button id="btnSubmitAnswer" class="btn">Submit answer</button>
        ${allowReveal ? '<button id="btnRevealAnswer" class="btn secondary">Reveal answer and continue</button>' : ''}
      </div>
    `));

    showNotepadPanel({ phaseName: phaseLabel, trialNumber: progressLabel, problemId: problem.id });
    const answerBox = $("answerBox");
    const answerErr = $("answerErr");
    const t0 = now();
    answerBox.focus();
    restrictAnswerBox(answerBox);

    const outcome = await new Promise(resolve => {
      let resolved = false;
      let checker = null;
      function finish(value) {
        if (resolved) return;
        resolved = true;
        if (checker) window.clearInterval(checker);
        resolve(value);
      }
      function submit() {
        const parsed = parseFractionInput(answerBox.value);
        if (!parsed.ok) {
          answerErr.style.display = "block";
          answerErr.textContent = parsed.error;
          return;
        }
        finish({ action: "submitted", answerRaw: answerBox.value, parsed });
      }
      $("btnSubmitAnswer").onclick = submit;
      if (allowReveal) $("btnRevealAnswer").onclick = () => finish({ action: "revealed" });
      answerBox.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
      checker = window.setInterval(() => {
        if (!studyTimeRemaining()) {
          window.clearInterval(checker);
          finish({ action: "timeout" });
        }
      }, 200);
    });

    const rtMs = Math.round(now() - t0);
    const notepadText = captureNotepadSnapshot(phaseLabel, progressLabel, problem.id);
    const calculatorSnapshot = captureCalculatorSnapshot();
    if (outcome.action !== "submitted") {
      logEvent(`${phaseLabel}_${outcome.action}`, { problemId: problem.id, responseRTms: rtMs });
      return { ...outcome, rtMs, notepadText, ...calculatorSnapshot };
    }

    const correctFrac = frac(problem.correctNumerator, problem.correctDenominator);
    const correct = sameFrac(outcome.parsed.value, correctFrac) ? 1 : 0;
    logEvent(`${phaseLabel}_answer_submitted`, { problemId: problem.id, correct, responseRTms: rtMs });
    return { ...outcome, correct, rtMs, notepadText, ...calculatorSnapshot };
  }

  async function feedbackScreen({ problem, correct, responseText }) {

  async function runAnswerExposureTrial(problem, practiceTrialNumber) {
    state.phase = "answer_exposure";
    setHeader(`Learning problem ${practiceTrialNumber}`);
    setFooter("Please wait while the answer is calculated");
    const t0 = now();
    logEvent("answer_exposure_trial_start", { practiceTrialNumber, problemId: problem.id });

    render(html(`
      <div class="row"><div class="pill">Learning problem ${practiceTrialNumber}</div></div>
      <div class="notice">
        <div class="small muted">Problem</div>
        <div class="math">${problem.expressionHTML}</div>
        <div class="hr"></div>
        <div id="exposureStatus" class="notice" style="margin-top:16px">
          <div><b>Calculating the answer…</b></div>
          <div class="small muted">Please wait.</div>
        </div>
        <div id="exposureAnswer" style="display:none">
          <div class="small muted">Calculated answer</div>
          <div class="math">${escapeHTML(problem.correctText)}</div>
          <div class="notice">
            <div><b>Input the calculated answer below.</b></div>
            <div class="small muted">Then use the remaining time to think about how the answer follows from the problem.</div>
            <input id="exposureCopyBox" class="input" autocomplete="off" placeholder="Type the answer exactly as shown" style="margin-top:12px" />
            <div id="exposureCopyMessage" class="small muted" style="margin-top:8px">You must type the answer correctly before continuing.</div>
          </div>
          <div id="reflectionStatus" class="small muted">Please think about what calculations got to this answer.</div>
        </div>
      </div>
      <div class="row"><button id="btnNextExposure" class="btn" disabled>Next problem</button></div>
    `));
    showNotepadPanel({ phaseName: "answer_exposure", trialNumber: practiceTrialNumber, problemId: problem.id });

    const action = await new Promise(resolve => {
      let done = false;
      let answerShown = false;
      let copiedCorrectly = false;
      let copiedAnswerRaw = "";
      const answerDelayMs = 10000;
      const reflectionDelayMs = 15000;
      const answerAt = t0 + answerDelayMs;
      const nextAt = answerAt + reflectionDelayMs;

      const finish = value => {
        if (done) return;
        done = true;
        window.clearInterval(checker);
        resolve(value);
      };

      $("btnNextExposure").onclick = () => {
        if (!$("btnNextExposure").disabled) finish({ action: "continued", copiedAnswerRaw });
      };

      const checker = window.setInterval(() => {
        if (!studyTimeRemaining()) {
          finish({ action: "timeout", copiedAnswerRaw });
          return;
        }

        const current = now();
        if (!answerShown) {
          if (current >= answerAt) {
            answerShown = true;
            $("exposureStatus").style.display = "none";
            $("exposureAnswer").style.display = "block";
            const copyBox = $("exposureCopyBox");
            const copyMessage = $("exposureCopyMessage");
            restrictAnswerBox(copyBox);
            copyBox.focus();
            const evaluateCopy = () => {
              copiedAnswerRaw = copyBox.value;
              const parsed = parseFractionInput(copiedAnswerRaw);
              const correctFrac = frac(problem.correctNumerator, problem.correctDenominator);
              copiedCorrectly = Boolean(parsed.ok && sameFrac(parsed.value, correctFrac));
              copyMessage.textContent = copiedCorrectly
                ? "Answer inputted correctly. Please reflect on the answer."
                : "Input the calculated answer correctly before continuing.";
              copyMessage.className = copiedCorrectly ? "small good" : "small muted";
            };
            copyBox.addEventListener("input", evaluateCopy);
            setFooter("Input the answer and think about what calculations got to this answer");
            logEvent("answer_exposure_answer_shown", {
              practiceTrialNumber,
              problemId: problem.id,
              answerRevealDelayMs: Math.round(current - t0)
            });
          }
          return;
        }

        if (current < nextAt) {
          setFooter("Please think about what calculations got to this answer");
        } else if (!copiedCorrectly) {
          setFooter("Input the answer correctly to continue");
        } else {
          $("btnNextExposure").disabled = false;
          $("reflectionStatus").innerHTML = '<span class="good"><b>Contemplation period complete.</b></span>';
          setFooter("You may continue");
        }
      }, 100);
    });

    const rtMs = Math.round(now() - t0);
    const notepadText = captureNotepadSnapshot("answer_exposure", practiceTrialNumber, problem.id);
    const calculatorSnapshot = captureCalculatorSnapshot();
    const actionName = typeof action === "string" ? action : action.action;
    const copiedAnswerRaw = typeof action === "object" ? (action.copiedAnswerRaw || "") : "";
    const copiedParsed = parseFractionInput(copiedAnswerRaw);
    const copiedCorrect = copiedParsed.ok && sameFrac(copiedParsed.value, frac(problem.correctNumerator, problem.correctDenominator)) ? 1 : 0;
    state.practiceRows.push({
      kind: "practice_trial", participantId: state.participantId, timestampISO: new Date().toISOString(),
      practiceCondition: state.practiceCondition, practiceTrialNumber, problemId: problem.id, difficulty: problem.difficulty, steps: problem.steps,
      expressionText: asciiMathText(problem.expressionText), correctTextRaw: problem.correctText, correctTextExcel: excelText(problem.correctText),
      action: actionName, attempted: 0, pressedRevealAnswer: 0, revealedAnswer: 1,
      copiedAnswerRaw, copiedAnswerRawExcel: excelText(copiedAnswerRaw), copiedAnswerCorrect: copiedCorrect,
      answerCorrect: copiedCorrect, correct: copiedCorrect,
      answerRevealDelayMs: 10000, requiredReflectionMs: 15000,
      notepadText,
      calculatorInputAtEnd: calculatorSnapshot.calculatorInputAtEnd,
      calculatorEntriesJSON: calculatorSnapshot.calculatorEntriesJSON,
      questionTimeMs: rtMs, questionTimeSeconds: Number((rtMs / 1000).toFixed(3)), responseRTms: rtMs, elapsedStudyMs: elapsedStudyMs()
    });
    logEvent("answer_exposure_trial_end", {
      practiceTrialNumber, problemId: problem.id, action: actionName,
      copiedAnswerRaw, copiedAnswerCorrect: copiedCorrect, responseRTms: rtMs
    });
    return actionName !== "timeout";
  }

  function guidedStepPromptHTML(step, stepIndex) {
    if (stepIndex === 0) return step.expressionHTML;
    return `<span id="guidedPrev${stepIndex}">[your Step ${stepIndex} answer]</span> ${opHTML(step.op)} ${step.rightHTML}`;
  }

  async function runGuidedTableTrial(problem, practiceTrialNumber) {
    state.phase = "guided_table";
    const scaffolded = practiceTrialNumber <= CONFIG.guidedScaffoldTrials;
    const steps = problem.intermediateSteps || [];
    setHeader(`Guided problem ${practiceTrialNumber}`);
    setFooter(  
      scaffolded ? "Solve each intermediate calculation" : "Solve independently; hints are available"
    );
    logEvent("guided_intermediate_trial_start", {
      practiceTrialNumber,
      problemId: problem.id,
      scaffolded: scaffolded ? 1 : 0,
      intermediateStepsJSON: JSON.stringify(steps.map(x => ({
        stepNumber: x.stepNumber,
        expressionText: x.expressionText,
        correctText: x.correctText
      })))
    });

    if (scaffolded) {
      const rows = steps.map((step, i) => `
        <div class="notice" style="margin-bottom:10px">
          <div><b>${i + 1}. ${guidedStepPromptHTML(step, i)}</b></div>
          <input id="guidedStepAnswer${i}" class="input" autocomplete="off" placeholder="Write answer" style="margin-top:10px" />
          <div id="guidedStepErr${i}" class="small bad" style="display:none;margin-top:6px"></div>
        </div>
      `).join("");

      render(html(`
        <div class="row"><div class="pill">Guided problem ${practiceTrialNumber}</div></div>
        <div class="notice"><div class="small muted">Full problem</div><div class="math">${problem.expressionHTML}</div></div>
        <div class="notice">
          <div><b>Solve the problem one intermediate calculation at a time.</b></div>
          <div class="small muted">Use each answer in the next line.</div>
        </div>
        ${rows}
        <div class="row"><button id="btnSubmitGuided" class="btn">Submit answers</button></div>
        <div id="guidedErr" class="small bad" style="display:none;margin-top:8px"></div>
      `));
      showNotepadPanel({ phaseName: "guided_scaffold", trialNumber: practiceTrialNumber, problemId: problem.id });

      steps.forEach((_, i) => {
        const input = $("guidedStepAnswer" + i);
        restrictAnswerBox(input);
        if (i < steps.length - 1) {
          input.addEventListener("input", () => {
            const next = $("guidedPrev" + (i + 1));
            if (next) next.textContent = input.value.trim() || `[your Step ${i + 1} answer]`;
          });
        }
      });
      $("guidedStepAnswer0")?.focus();

      const t0 = now();
      const outcome = await new Promise(resolve => {
        let done = false;
        const finish = value => { if (!done) { done = true; clearInterval(checker); resolve(value); } };
        $("btnSubmitGuided").onclick = () => {
          const rawAnswers = steps.map((_, i) => $("guidedStepAnswer" + i)?.value || "");
          const parsedAnswers = [];
          let anyInvalid = false;
          rawAnswers.forEach((raw, i) => {
            const parsed = parseFractionInput(raw);
            parsedAnswers.push(parsed);
            const err = $("guidedStepErr" + i);
            if (!parsed.ok) {
              anyInvalid = true;
              err.style.display = "block";
              err.textContent = "Enter a whole number or fraction.";
            } else {
              err.style.display = "none";
            }
          });
          if (anyInvalid) return;
          finish({ action: "submitted", rawAnswers, parsedAnswers });
        };
        const checker = setInterval(() => { if (!studyTimeRemaining()) finish({ action: "timeout" }); }, 200);
      });

      const rtMs = Math.round(now() - t0);
      const notepadText = captureNotepadSnapshot("guided_scaffold", practiceTrialNumber, problem.id);
      const calculatorSnapshot = captureCalculatorSnapshot();
      const rawAnswers = outcome.rawAnswers || steps.map((_, i) => $("guidedStepAnswer" + i)?.value || "");
      const parsedAnswers = outcome.parsedAnswers || rawAnswers.map(parseFractionInput);
      const stepCorrect = steps.map((step, i) => {
        const parsed = parsedAnswers[i];
        return parsed?.ok && sameFrac(parsed.value, frac(step.correctNumerator, step.correctDenominator)) ? 1 : 0;
      });
      const finalIndex = steps.length - 1;
      const finalParsed = parsedAnswers[finalIndex];
      const correct = outcome.action === "submitted" ? stepCorrect[finalIndex] : "";

      state.practiceRows.push({
        kind: "practice_trial", participantId: state.participantId, timestampISO: new Date().toISOString(),
        practiceCondition: state.practiceCondition, practiceTrialNumber, problemId: problem.id, difficulty: problem.difficulty, steps: problem.steps,
        expressionText: asciiMathText(problem.expressionText), correctTextRaw: problem.correctText, correctTextExcel: excelText(problem.correctText),
        action: outcome.action, attempted: outcome.action === "submitted" ? 1 : 0, pressedRevealAnswer: 0, revealedAnswer: 0,
        responseRaw: outcome.action === "submitted" ? rawAnswers[finalIndex].trim() : "",
        responseNormalizedRaw: outcome.action === "submitted" ? finalParsed.normalized : "",
        answerCorrect: correct, correct,
        scaffoldedIntermediatePractice: 1, hintsUsed: 0,
        intermediateResponsesJSON: JSON.stringify(rawAnswers),
        intermediateNormalizedJSON: JSON.stringify(parsedAnswers.map(x => x?.ok ? x.normalized : "")),
        intermediateCorrectJSON: JSON.stringify(stepCorrect),
        intermediateCorrectAnswersJSON: JSON.stringify(steps.map(x => x.correctText)),
        notepadText,
        calculatorInputAtEnd: calculatorSnapshot.calculatorInputAtEnd,
        calculatorEntriesJSON: calculatorSnapshot.calculatorEntriesJSON,
        questionTimeMs: rtMs, questionTimeSeconds: Number((rtMs / 1000).toFixed(3)), responseRTms: rtMs, elapsedStudyMs: elapsedStudyMs()
      });

      if (outcome.action === "timeout") return false;
      await feedbackScreen({ problem, correct, responseText: finalParsed.normalized });
      return true;
    }

    // After the first few guided items, participants solve independently.
    // Hints reveal correct intermediate answers one at a time, never the final answer.
    const hintSteps = steps.slice(0, Math.max(0, steps.length - 1));
    render(html(`
      <div class="row"><div class="pill">Guided problem ${practiceTrialNumber}</div></div>
      <div class="notice"><div class="small muted">Calculate:</div><div class="math">${problem.expressionHTML}</div></div>
      <div class="notice">
        <div class="small"><b>Your final answer</b></div>
        <input id="guidedFinalAnswer" class="input" autocomplete="off" placeholder="e.g., 3/4 or 2" />
        <div id="guidedFinalErr" class="small bad" style="display:none;margin-top:8px"></div>
      </div>
      <div id="guidedHints"></div>
      <div class="row">
        ${hintSteps.length ? '<button id="btnHint" class="btn secondary">Reveal an intermediate-answer hint</button>' : ''}
        <button id="btnSubmitGuided" class="btn">Submit final answer</button>
      </div>
    `));
    showNotepadPanel({ phaseName: "guided_independent", trialNumber: practiceTrialNumber, problemId: problem.id });
    restrictAnswerBox($("guidedFinalAnswer"));
    $("guidedFinalAnswer").focus();

    let hintsUsed = 0;
    const revealedHints = [];
    if (hintSteps.length) {
      $("btnHint").onclick = () => {
        if (hintsUsed >= hintSteps.length) return;
        const step = hintSteps[hintsUsed];
        revealedHints.push({ stepNumber: step.stepNumber, expressionText: step.expressionText, correctText: step.correctText });
        $("guidedHints").insertAdjacentHTML("beforeend", `
          <div class="notice">
            <div><b>Intermediate hint ${hintsUsed + 1}</b></div>
            <div class="math" style="font-size:26px">${step.expressionHTML} = ${escapeHTML(step.correctText)}</div>
          </div>
        `);
        hintsUsed += 1;
        logEvent("guided_intermediate_hint", {
          practiceTrialNumber,
          problemId: problem.id,
          hintNumber: hintsUsed,
          stepNumber: step.stepNumber,
          correctIntermediateAnswer: step.correctText
        });
        if (hintsUsed >= hintSteps.length) {
          $("btnHint").disabled = true;
          $("btnHint").textContent = "All intermediate hints revealed";
        }
      };
    }

    const t0 = now();
    const outcome = await new Promise(resolve => {
      let done = false;
      const finish = value => { if (!done) { done = true; clearInterval(checker); resolve(value); } };
      const submit = () => {
        const raw = $("guidedFinalAnswer").value;
        const parsed = parseFractionInput(raw);
        if (!parsed.ok) {
          $("guidedFinalErr").style.display = "block";
          $("guidedFinalErr").textContent = parsed.error;
          return;
        }
        finish({ action: "submitted", answerRaw: raw, parsed });
      };
      $("btnSubmitGuided").onclick = submit;
      $("guidedFinalAnswer").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
      const checker = setInterval(() => { if (!studyTimeRemaining()) finish({ action: "timeout" }); }, 200);
    });

    const rtMs = Math.round(now() - t0);
    const notepadText = captureNotepadSnapshot("guided_independent", practiceTrialNumber, problem.id);
    const calculatorSnapshot = captureCalculatorSnapshot();
    let correct = "";
    if (outcome.action === "submitted") {
      correct = sameFrac(outcome.parsed.value, frac(problem.correctNumerator, problem.correctDenominator)) ? 1 : 0;
    }

    state.practiceRows.push({
      kind: "practice_trial", participantId: state.participantId, timestampISO: new Date().toISOString(),
      practiceCondition: state.practiceCondition, practiceTrialNumber, problemId: problem.id, difficulty: problem.difficulty, steps: problem.steps,
      expressionText: asciiMathText(problem.expressionText), correctTextRaw: problem.correctText, correctTextExcel: excelText(problem.correctText),
      action: outcome.action, attempted: outcome.action === "submitted" ? 1 : 0, pressedRevealAnswer: 0, revealedAnswer: 0,
      responseRaw: outcome.action === "submitted" ? outcome.answerRaw.trim() : "",
      responseNormalizedRaw: outcome.action === "submitted" ? outcome.parsed.normalized : "",
      answerCorrect: correct, correct,
      scaffoldedIntermediatePractice: 0, hintsUsed,
      revealedIntermediateHintsJSON: JSON.stringify(revealedHints),
      intermediateCorrectAnswersJSON: JSON.stringify(hintSteps.map(x => x.correctText)),
      notepadText,
      calculatorInputAtEnd: calculatorSnapshot.calculatorInputAtEnd,
      calculatorEntriesJSON: calculatorSnapshot.calculatorEntriesJSON,
      questionTimeMs: rtMs, questionTimeSeconds: Number((rtMs / 1000).toFixed(3)), responseRTms: rtMs, elapsedStudyMs: elapsedStudyMs()
    });

    if (outcome.action === "timeout") return false;
    await feedbackScreen({ problem, correct, responseText: outcome.parsed.normalized });
    return true;
  }

  async function runPracticeBlock() {
    const practice = generatePracticeBank();
    checkProblemBank(practice);
    state.selectedPracticeProblems = practice;
    logEvent("practice_block_start", {
      practiceCondition: state.practiceCondition,
      targetDurationMs: CONFIG.practicePhaseMs,
      minimumPracticeProblems: CONFIG.minimumPracticeProblems,
      problemIds: practice.map(p => p.id).join(";")
    });

    let trial = 0;
    let queue = [];
    while (shouldContinuePracticeBlock()) {
      if (queue.length === 0) queue = shuffledCopy(practice);
      const problem = queue.shift();
      trial += 1;

      let completed;
      if (state.practiceCondition === "answer_exposure") completed = await runAnswerExposureTrial(problem, trial);
      else if (state.practiceCondition === "guided_table") completed = await runGuidedTableTrial(problem, trial);
      else completed = await runPracticeTrial(problem, trial);

      if (!completed || !studyTimeRemaining()) break;
    }

    logEvent("practice_block_end", {
      nPracticeTrials: state.practiceRows.length,
      minimumPracticeProblems: CONFIG.minimumPracticeProblems,
      practiceElapsedMs: state.taskStartedAtMs == null ? "" : Date.now() - state.taskStartedAtMs,
      elapsedStudyMs: elapsedStudyMs()
    });
  }

      let finished = false;
      const finish = value => {
        if (finished) return;
        finished = true;
        clearInterval(checker);
        resolve(value);
      };

      $("btnSubmitRatings").onclick = () => {
        const difficulty = document.querySelector('input[name="practiceDifficulty"]:checked')?.value;
        const success = document.querySelector('input[name="practiceSuccess"]:checked')?.value;
        const rewarding = document.querySelector('input[name="practiceRewarding"]:checked')?.value;
        const learning = document.querySelector('input[name="practiceLearning"]:checked')?.value;
        if (!difficulty || !success || !rewarding || !learning) {
          $("ratingsErr").style.display = "block";
          return;
        }
        finish({
          action: "submitted",
          difficulty: Number(difficulty),
          success: Number(success),
          rewarding: Number(rewarding),
          learning: Number(learning)
        });
      };

      const checker = setInterval(() => {
        if (!studyTimeRemaining()) finish({ action: "timeout" });
      }, 200);
    });

    const rtMs = Math.round(now() - t0);
    state.practiceRatings = {
      kind: "practice_ratings",
      participantId: state.participantId,
      timestampISO: new Date().toISOString(),
      practiceConditionNumber: state.practiceConditionNumber,
      practiceCondition: state.practiceCondition,
      action: result.action,
      practiceDifficulty: result.action === "submitted" ? result.difficulty : "",
      practiceSuccess: result.action === "submitted" ? result.success : "",
      practiceRewarding: result.action === "submitted" ? result.rewarding : "",
      practiceLearning: result.action === "submitted" ? result.learning : "",
      ratingsRTms: rtMs,
      ratingsTimeSeconds: Number((rtMs / 1000).toFixed(3)),
      elapsedStudyMs: elapsedStudyMs()
    };

    logEvent("practice_ratings_response", {
      action: result.action,
      practiceDifficulty: state.practiceRatings.practiceDifficulty,
      practiceSuccess: state.practiceRatings.practiceSuccess,
      practiceRewarding: state.practiceRatings.practiceRewarding,
      practiceLearning: state.practiceRatings.practiceLearning,
      ratingsRTms: rtMs
    });

    return result.action === "submitted";
  }


  async function runMainTrial(problem, trialNumber) {
    state.phase = "main_task";
    setHeader(`Main task problem ${trialNumber}`);
    logEvent("main_trial_start", { trialNumber, problemId: problem.id, difficulty: problem.difficulty, steps: problem.steps });

    const result = await collectFractionAnswer({ problem, phaseLabel: "main", progressLabel: `Main task problem ${trialNumber}`, allowReveal: true });

    state.dstPerformanceRows.push({
      kind: "main_trial",
      participantId: state.participantId,
      timestampISO: new Date().toISOString(),
      dstTrialNumber: trialNumber,
      problemId: problem.id,
      difficulty: problem.difficulty,
      steps: problem.steps,
      expressionText: asciiMathText(problem.expressionText),
      correctTextRaw: problem.correctText,
      correctTextExcel: excelText(problem.correctText),
      correctNumerator: problem.correctNumerator,
      correctDenominator: problem.correctDenominator,
      action: result.action,
      attempted: result.action === "submitted" ? 1 : 0,
      pressedRevealAnswer: result.action === "revealed" ? 1 : 0,
      revealedAnswer: result.action === "revealed" ? 1 : 0,
      responseRaw: result.action === "submitted" ? String(result.answerRaw || "").trim() : "",
      responseRawExcel: result.action === "submitted" ? excelText(String(result.answerRaw || "").trim()) : "",
      responseNormalizedRaw: result.action === "submitted" ? result.parsed.normalized : "",
      responseNormalizedExcel: result.action === "submitted" ? excelText(result.parsed.normalized) : "",
      responseNumerator: result.action === "submitted" ? result.parsed.value.n : "",
      responseDenominator: result.action === "submitted" ? result.parsed.value.d : "",
      answerCorrect: result.action === "submitted" ? result.correct : "",
      correct: result.action === "submitted" ? result.correct : "",
      questionTimeMs: result.rtMs,
      questionTimeSeconds: Number((result.rtMs / 1000).toFixed(3)),
      responseRTms: result.rtMs,
      notepadText: result.notepadText || "",
      calculatorInputAtEnd: result.calculatorInputAtEnd || "",
      calculatorEntriesJSON: result.calculatorEntriesJSON || "[]",
      elapsedStudyMs: elapsedStudyMs()
    });

    if (result.action === "timeout") return false;
    if (result.action === "revealed") await showGivenAnswerScreen(problem, trialNumber, "Main task");
    else await feedbackScreen({ problem, correct: result.correct, responseText: result.parsed.normalized });
    return true;
  }

  async function showGivenAnswerScreen(problem, trialNumber, phaseName) {
    hideNotepadPanel();
    setHeader(`${phaseName}: answer revealed`);
    setFooter("");
    render(html(`
      <div class="notice">
        <div><b>Correct answer</b></div>
        <div class="small muted">Problem:</div>
        <div class="math">${problem.expressionHTML}</div>
        <div class="hr"></div>
        <div class="math">${escapeHTML(problem.correctText)}</div>
      </div>
    `));
    logEvent("answer_revealed", { phaseName, trialNumber, problemId: problem.id, correctTextRaw: problem.correctText });
    await wait(Math.min(CONFIG.revealAnswerMs, remainingStudyMs()));
  }

  async function runDSTBlock() {
    const hardBank = generateDSTHardBank();
    checkProblemBank(hardBank);
    state.selectedDSTProblems = shuffledCopy(hardBank).slice(0, CONFIG.mainTaskTrials);
    logEvent("main_block_start", {
      bankSize: hardBank.length,
      targetTrials: CONFIG.mainTaskTrials,
      problemIds: state.selectedDSTProblems.map(p => p.id).join(";")
    });

    for (let i = 0; i < state.selectedDSTProblems.length; i++) {
      if (!studyTimeRemaining()) break;
      const completed = await runMainTrial(state.selectedDSTProblems[i], i + 1);
      if (!completed) break;
    }

    logEvent("main_block_end", {
      nMainTrials: state.dstPerformanceRows.length,
      targetTrials: CONFIG.mainTaskTrials,
      elapsedStudyMs: elapsedStudyMs()
    });
  }


  // ============================================================
  // CSV + DATAPIPE
  // ============================================================
  function flattenForCSV() {
    const rows = [];

    rows.push({
      kind: "meta",
      participantId: state.participantId,
      startedAtISO: state.startedAtISO,
      exportedAtISO: new Date().toISOString(),
      plannedDurationMs: CONFIG.totalStudyMs,
      plannedPracticeDurationMs: CONFIG.practicePhaseMs,
      minimumPracticeProblems: CONFIG.minimumPracticeProblems,
      plannedMainTrials: CONFIG.mainTaskTrials,
      elapsedStudyMs: elapsedStudyMs(),
      nPracticeTrials: state.practiceRows.length,
      nDSTTrials: state.dstPerformanceRows.length,
      notepadText: state.notepadText,
      notepadHistoryJSON: JSON.stringify(state.notepadHistory),
      calculatorHistoryJSON: JSON.stringify(state.calculatorHistory),
      practiceConditionNumber: state.practiceConditionNumber,
      practiceCondition: state.practiceCondition,
      practiceConditionSource: state.practiceConditionSource,
      practiceConditionError: state.practiceConditionError || "",
      practiceProblemIds: state.selectedPracticeProblems.map(p => p.id).join(";"),
      dstProblemIds: state.selectedDSTProblems.map(p => p.id).join(";")
    });

    if (state.consent) rows.push(state.consent);
    if (state.practiceRatings) rows.push(state.practiceRatings);

    for (const e of state.events) rows.push(e);
    for (const p of state.practiceRows) rows.push(p);
    for (const c of state.dstChoiceRows) rows.push(c);
    for (const d of state.dstPerformanceRows) rows.push(d);

    return rows;
  }

  function toCSV(rows) {
    if (!rows || rows.length === 0) return "";

    const headerSet = new Set();
    rows.forEach(r => Object.keys(r).forEach(k => headerSet.add(k)));

    const preferred = [
      "kind",
      "participantId",
      "timestampISO",
      "agreed",
      "startedAtISO",
      "exportedAtISO",
      "eventIndex",
      "type",
      "plannedDurationMs",
      "plannedPracticeDurationMs",
      "minimumPracticeProblems",
      "plannedMainTrials",
      "elapsedStudyMs",
      "notepadText",
      "notepadHistoryJSON",
      "calculatorInputAtEnd",
      "calculatorEntriesJSON",
      "calculatorHistoryJSON",
      "practiceConditionNumber",
      "practiceCondition",
      "practiceConditionSource",
      "practiceConditionError",
      "practiceDifficulty",
      "practiceSuccess",
      "practiceRewarding",
      "practiceLearning",
      "ratingsRTms",
      "ratingsTimeSeconds",
      "nPracticeTrials",
      "nDSTTrials",
      "practiceProblemIds",
      "dstProblemIds",
      "practiceTrialNumber",
      "dstTrialNumber",
      "problemId",
      "difficulty",
      "steps",
      "expressionText",
      "choice",
      "choseComplete",
      "choseGivenAnswer",
      "choiceRTms",
      "action",
      "attempted",
      "pressedRevealAnswer",
      "revealedAnswer",
      "correctTextRaw",
      "correctTextExcel",
      "correctNumerator",
      "correctDenominator",
      "responseRaw",
      "responseRawExcel",
      "responseNormalizedRaw",
      "responseNormalizedExcel",
      "responseNumerator",
      "responseDenominator",
      "answerCorrect",
      "correct",
      "questionTimeMs",
      "questionTimeSeconds",
      "responseRTms",
      "hintsUsed",
      "scaffoldedIntermediatePractice",
      "intermediateResponsesJSON",
      "intermediateNormalizedJSON",
      "intermediateCorrectJSON",
      "intermediateCorrectAnswersJSON",
      "revealedIntermediateHintsJSON"
    ];

    const headers = [
      ...preferred.filter(h => headerSet.has(h)),
      ...Array.from(headerSet).filter(h => !preferred.includes(h))
    ];

    const esc = (v) => {
      const s = String(v ?? "");
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };

    return "\uFEFF" + [
      headers.join(","),
      ...rows.map(r => headers.map(h => esc(r[h])).join(","))
    ].join("\n");
  }

  async function saveCSVToPipe({ experimentID, filename, csvString }) {
    const res = await fetch("https://pipe.jspsych.org/api/data/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ experimentID, filename, data: csvString })
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => "");
      throw new Error(`Pipe save failed: ${res.status} ${res.statusText} ${txt}`);
    }

    return res.json().catch(() => ({}));
  }

  function downloadText(filename, text, mime = "text/csv") {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function buildRedirectURL() {
    if (!CONFIG.completionRedirectURL) return "";
    return CONFIG.completionRedirectURL.replaceAll("{participantId}", encodeURIComponent(state.participantId));
  }

  function redirectToCompletionURL() {
    const url = buildRedirectURL();
    if (!url) return;
    window.location.href = url;
  }

  async function endScreen({ timedOut = false } = {}) {
    if (state.saving) return;
    state.saving = true;
    state.ended = true;
    if (state.timeoutHandle) window.clearTimeout(state.timeoutHandle);
    hideNotepadPanel();
    state.phase = "end";
    setHeader(timedOut ? "Time is up" : "Finished");
    setFooter("", "");

    const filename = `fraction-dst-sub-${state.participantId}-${Date.now()}.csv`;
    const csvString = toCSV(flattenForCSV());

    render(html(`
      <div class="notice">
        <div><b>${timedOut ? "The maximum timed period has ended." : "Study complete."}</b></div>
        <div class="small">Saving your data…</div>
        <div class="small">Please do not close this window.</div>
      </div>
    `));

    try {
      await saveCSVToPipe({
        experimentID: CONFIG.experimentID,
        filename,
        csvString
      });

      logEvent("datapipe_save_success", { filename });

      render(html(`
        <div class="notice">
          <div class="good"><b>Saved.</b></div>
          <div class="small muted">${escapeHTML(filename)}</div>
          <div class="small">You will now be redirected.</div>
        </div>
      `));

      await wait(700);
      redirectToCompletionURL();
    } catch (e) {
      console.error(e);
      const errorMessage = e instanceof Error ? e.message : String(e);
      logEvent("datapipe_save_failure", { filename, errorMessage });

      const rows = flattenForCSV();
      rows.push({
        kind: "save_error",
        participantId: state.participantId,
        timestampISO: new Date().toISOString(),
        errorMessage
      });
      const csvWithError = toCSV(rows);

      render(html(`
        <div class="notice">
          <div class="bad"><b>Upload failed.</b></div>
          <div class="small">The study is complete, but the data upload did not work.</div>
          <div class="hr"></div>
          <div class="small"><b>Error:</b> ${escapeHTML(errorMessage)}</div>
          <div class="hr"></div>
          <div class="small">Download the CSV and send it to the researcher.</div>
        </div>
        <div class="row">
          <button id="btnCsv" class="btn">Download CSV</button>
          <button id="btnRedirect" class="btn secondary">Redirect anyway</button>
        </div>
      `));

      $("btnCsv").onclick = () => downloadText(filename, csvWithError, "text/csv");
      $("btnRedirect").onclick = redirectToCompletionURL;
    }
  }

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    initStudy();

    const agreed = await consentScreen();
    if (!agreed) {
      await endNoConsentScreen();
      return;
    }

    assignPracticeCondition();
    await fractionInstructionsScreen();

    // The 35-minute maximum begins with practice, not with consent/instructions.
    startTimedStudy();
    await runPracticeBlock();
    if (!studyTimeRemaining()) {
      await endScreen({ timedOut: true });
      return;
    }

    const ratingsCompleted = await practiceRatingsScreen();
    if (!ratingsCompleted || !studyTimeRemaining()) {
      await endScreen({ timedOut: true });
      return;
    }

    await dstInstructionsScreen();
    if (!studyTimeRemaining()) {
      await endScreen({ timedOut: true });
      return;
    }

    await runDSTBlock();
    if (!state.ended) await endScreen({ timedOut: !studyTimeRemaining() });
  }


  boot().catch(e => {
    console.error(e);
    hideNotepadPanel();
    render(html(`
      <div class="notice">
        <div class="bad"><b>Unexpected error</b></div>
        <div class="small">${escapeHTML(e instanceof Error ? e.message : String(e))}</div>
      </div>
    `));
  });
})();
</script>
