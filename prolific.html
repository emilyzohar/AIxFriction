<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fraction Demand Selection Task</title>
  <style>
    :root {
      --bg: #f7f7f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --good: #047857;
      --bad: #b91c1c;
      --button: #111827;
      --buttonText: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    .shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 18px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 750;
    }

    #subheader {
      font-size: 14px;
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }

    .notice {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      margin: 14px 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .btn {
      appearance: none;
      border: 0;
      background: var(--button);
      color: var(--buttonText);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .btn.secondary {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn.large {
      min-width: 230px;
      min-height: 72px;
      font-size: 18px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .input {
      width: min(420px, 100%);
      font-size: 20px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
    }

    .small { font-size: 14px; }
    .muted { color: var(--muted); }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .hr { height: 1px; background: var(--border); margin: 16px 0; }

    .math {
      font-size: 34px;
      line-height: 1.5;
      margin: 10px 0;
    }

    .frac sup { font-size: .72em; vertical-align: .45em; }
    .frac sub { font-size: .72em; vertical-align: -.15em; }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      background: #fff;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-top: 14px;
    }

    .choiceGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .choiceCard {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0;
  background: #fff;
  overflow: hidden;
  min-height: 220px;
}

.choiceButton {
  width: 100%;
  height: 100%;
  min-height: 220px;
  border: none;
  background: transparent;
  font-size: 24px;
  font-weight: 700;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}
.completeButton {
  background: #d93025;
  color: white;
}

.completeButton:hover {
  background: #b3261e;
}

.answerButton {
  background: #1a73e8;
  color: white;
}

.answerButton:hover {
  background: #1558b0;
}


    .choiceTitle {
      font-weight: 750;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .calculator-panel-fixed {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 290px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 6px 22px rgba(0,0,0,.12);
      z-index: 10;
    }

    .notepad {
      width: calc(100% - 22px);
      min-height: 110px;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.35;
      padding: 9px 10px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .calc-key {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 8px 0;
      font-weight: 650;
      cursor: pointer;
    }

    .calc-input {
      width: calc(100% - 24px);
      font-size: 16px;
      padding: 8px 10px;
      margin-top: 8px;
    }

    .calc-result {
      min-height: 24px;
      font-size: 18px;
      margin-top: 4px;
    }

    .scaffold-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    .scaffold-table th, .scaffold-table td {
      border: 1px solid var(--border);
      padding: 8px;
      vertical-align: top;
    }
    .scaffold-table th {
      text-align: left;
      background: #f3f4f6;
    }
    .scaffold-input {
      width: calc(100% - 18px);
      min-height: 34px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }

    .step-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: #f9fafb;
      margin-top: 10px;
    }
    .step-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      cursor: grab;
      user-select: none;
    }
    .step-card:active { cursor: grabbing; }
    .step-slot {
      min-height: 42px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 5px;
      background: #fff;
    }
    .step-slot.drag-over, .step-bank.drag-over {
      outline: 2px solid #6b7280;
      outline-offset: 1px;
    }

    .likert-scale {
      display: grid;
      grid-template-columns: repeat(7, minmax(42px, 1fr));
      gap: 8px;
      margin-top: 16px;
    }
    .likert-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    .likert-option input { width: 20px; height: 20px; }
    .likert-option span { font-weight: 650; }
    .likert-anchors {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .calculator-panel-fixed {
        position: static;
        width: auto;
        margin-top: 18px;
      }
      .math { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <h1>Fraction Study</h1>
      <div id="subheader"></div>
    </div>
    <main id="content" class="card"></main>
    <div class="footer">
      <div id="leftFooter"></div>
      <div id="rightFooter"></div>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  // ============================================================
  // CONFIG: EDIT THESE BEFORE LAUNCHING
  // ============================================================
  const CONFIG = {
    experimentID: "10wm0RGeMQyL", // DataPipe experiment ID
    // Replace with the completion URL supplied by Prolific (normally ends in ?cc=XXXXXXX).
    completionRedirectURL: "https://app.prolific.com/submissions/complete?cc=REPLACE_WITH_PROLIFIC_COMPLETION_CODE",
    totalStudyMs: 15 * 60 * 1000,
    practicePhaseMs: 5 * 60 * 1000,
    feedbackMs: 700,
    revealAnswerMs: 1200,
    allowMixedNumbers: true,
    downloadCSVOnPipeFailure: true
  };

  // ============================================================
  // STATE
  // ============================================================
  const state = {
    participantId: null,
    startedAtISO: null,
    phase: null,
    events: [],
    practiceRows: [],
    dstChoiceRows: [],
    dstPerformanceRows: [],
    selectedPracticeProblems: [],
    selectedDSTProblems: [],
    consent: null,
    practiceRatings: null,
    taskStartedAtMs: null,
    taskDeadlineMs: null,
    practiceDeadlineMs: null,
    timeoutHandle: null,
    ended: false,
    saving: false,
    notepadText: "",
    practiceCondition: null,
    practiceConditionNumber: null,
    practiceConditionSource: null,
    practiceConditionError: null,
    _eventIndex: 0
  };

  // ============================================================
  // BASIC HELPERS
  // ============================================================
  function collectURLParams() {
    const combined = new Map();

    function addParams(raw) {
      if (!raw) return;
      let text = String(raw).replace(/^[?#]/, "");

      // Qualtrics or another redirect layer may encode the entire query string.
      // Decode up to twice, stopping when decoding no longer changes the text.
      for (let i = 0; i < 2; i++) {
        try {
          const decoded = decodeURIComponent(text);
          if (decoded === text) break;
          text = decoded;
        } catch (_) {
          break;
        }
      }

      const params = new URLSearchParams(text);
      for (const [key, value] of params.entries()) {
        combined.set(String(key).trim().toLowerCase(), String(value).trim());
      }
    }

    addParams(window.location.search);
    addParams(window.location.hash);

    // Also handle a nested URL/query passed as a single encoded parameter.
    for (const value of Array.from(combined.values())) {
      if (value.includes("PROLIFIC_PID=") || value.includes("prolific_pid=")) {
        const nestedQuery = value.includes("?") ? value.split("?").slice(1).join("?") : value;
        addParams(nestedQuery);
      }
    }

    return combined;
  }

  function getParam(params, ...names) {
    for (const name of names) {
      const value = params.get(String(name).toLowerCase());
      if (value !== undefined && value !== null && value !== "") return value;
    }
    return "";
  }

  function getURLParams() {
    const params = collectURLParams();
    return {
      participantId: getParam(params, "PROLIFIC_PID", "participantId", "participant_id") || "MISSING_PROLIFIC_PID",
      studyId: getParam(params, "STUDY_ID", "studyId", "study_id"),
      sessionId: getParam(params, "SESSION_ID", "sessionId", "session_id"),
      condition: getParam(params, "condition"),
      receivedParams: Object.fromEntries(params.entries())
    };
  }

  function initStudy() {
    const { participantId, studyId, sessionId, receivedParams } = getURLParams();
    state.participantId = participantId;
    state.studyId = studyId;
    state.sessionId = sessionId;
    state.startedAtISO = new Date().toISOString();
    logEvent("study_page_loaded", {
      participantId,
      studyId,
      sessionId,
      receivedURL: window.location.href,
      receivedParams: JSON.stringify(receivedParams)
    });
  }

  const PRACTICE_CONDITIONS = [
    "solve_practice",
    "answer_exposure",
    "guided_table"
  ];

  function assignPracticeCondition() {
    const { condition: rawCondition } = getURLParams();
    const conditionNumber = Number(rawCondition);

    if (rawCondition === null || String(rawCondition).trim() === "") {
      throw new Error(
        "Missing condition URL parameter. The study URL must include condition=0, condition=1, or condition=2."
      );
    }

    if (!Number.isInteger(conditionNumber) || conditionNumber < 0 || conditionNumber >= PRACTICE_CONDITIONS.length) {
      throw new Error(
        `Invalid condition URL parameter: ${rawCondition}. Use condition=0, condition=1, or condition=2.`
      );
    }

    state.practiceConditionNumber = conditionNumber;
    state.practiceCondition = PRACTICE_CONDITIONS[conditionNumber];
    state.practiceConditionSource = "url_parameter";
    state.practiceConditionError = null;

    logEvent("practice_condition_assigned", {
      practiceConditionNumber: state.practiceConditionNumber,
      practiceCondition: state.practiceCondition,
      practiceConditionSource: state.practiceConditionSource,
      practiceConditionError: ""
    });
  }

  function startTimedStudy() {
    state.taskStartedAtMs = Date.now();
    state.practiceDeadlineMs = state.taskStartedAtMs + CONFIG.practicePhaseMs;
    state.taskDeadlineMs = state.taskStartedAtMs + CONFIG.totalStudyMs;
    logEvent("timed_study_start", {
      totalStudyMs: CONFIG.totalStudyMs,
      practicePhaseMs: CONFIG.practicePhaseMs
    });
    state.timeoutHandle = window.setTimeout(() => {
      logEvent("study_time_expired", { elapsedMs: elapsedStudyMs() });
      endScreen({ timedOut: true });
    }, CONFIG.totalStudyMs);
  }

  function elapsedStudyMs() {
    return state.taskStartedAtMs == null ? 0 : Math.max(0, Date.now() - state.taskStartedAtMs);
  }

  function remainingStudyMs() {
    return state.taskDeadlineMs == null ? CONFIG.totalStudyMs : Math.max(0, state.taskDeadlineMs - Date.now());
  }

  function practiceTimeRemaining() {
    return state.practiceDeadlineMs != null && Date.now() < state.practiceDeadlineMs;
  }

  function studyTimeRemaining() {
    return state.taskDeadlineMs != null && Date.now() < state.taskDeadlineMs && !state.ended;
  }

  function formatClock(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes}:${String(seconds).padStart(2, "0")}`;
  }

  function logEvent(type, payload = {}) {
    state._eventIndex += 1;
    state.events.push({
      kind: "event",
      participantId: state.participantId,
      eventIndex: state._eventIndex,
      timestampISO: new Date().toISOString(),
      type,
      ...payload
    });
  }

  function now() { return performance.now(); }
  function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function shuffledCopy(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function escapeHTML(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function html(s) {
    const d = document.createElement("div");
    d.innerHTML = s;
    return d;
  }

  function clearContent() { $("content").innerHTML = ""; }
  function render(node) { clearContent(); $("content").appendChild(node); }
  function setHeader(text) { $("subheader").textContent = text || ""; }
  function setFooter(left = "", right = "") {
    $("leftFooter").textContent = left || "";
    $("rightFooter").textContent = right || "";
  }

  function asciiMathText(s) {
    return String(s ?? "")
      .replace(/−/g, "-")
      .replace(/×/g, "*")
      .replace(/÷/g, "/")
      .replace(/\u00A0/g, " ");
  }

  function excelText(s) {
    const v = String(s ?? "");
    if (v === "") return "";
    return `="${v.replace(/"/g, '""')}"`;
  }

  // ============================================================
  // EXACT FRACTION ARITHMETIC
  // ============================================================
  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b !== 0) {
      const t = b;
      b = a % b;
      a = t;
    }
    return a || 1;
  }

  function frac(n, d = 1) {
    if (d === 0) throw new Error("Zero denominator");
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    return { n: n / g, d: d / g };
  }

  function add(a, b) { return frac(a.n * b.d + b.n * a.d, a.d * b.d); }
  function sub(a, b) { return frac(a.n * b.d - b.n * a.d, a.d * b.d); }
  function mul(a, b) { return frac(a.n * b.n, a.d * b.d); }
  function div(a, b) { return frac(a.n * b.d, a.d * b.n); }

  function sameFrac(a, b) { return a && b && a.n === b.n && a.d === b.d; }

  function fracText(f) {
    if (!f) return "";
    if (f.d === 1) return String(f.n);
    return `${f.n}/${f.d}`;
  }

  function rawFracHTML(n, d, forceFraction = false) {
    if (d === 1 && !forceFraction) return String(n);
    return `<span class="frac"><sup>${n}</sup>&frasl;<sub>${d}</sub></span>`;
  }

  function fracHTML(f) {
    if (!f) return "";
    if (f.d === 1) return String(f.n);
    return rawFracHTML(f.n, f.d);
  }

  function parseFractionInput(raw) {
    const s = String(raw || "").trim();
    if (!s) return { ok: false, error: "Please enter an answer." };
    if (s.includes(".")) return { ok: false, error: "Decimals are not allowed. Enter a whole number or fraction." };

    if (/^-?\d+$/.test(s)) {
      return { ok: true, value: frac(Number(s), 1), normalized: String(Number(s)) };
    }

    let m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if (m) {
      const n = Number(m[1]);
      const d = Number(m[2]);
      if (d === 0) return { ok: false, error: "The denominator cannot be 0." };
      const f = frac(n, d);
      return { ok: true, value: f, normalized: fracText(f) };
    }

    if (CONFIG.allowMixedNumbers) {
      m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
      if (m) {
        const whole = Number(m[1]);
        const n = Number(m[2]);
        const d = Number(m[3]);
        if (d === 0) return { ok: false, error: "The denominator cannot be 0." };
        const sign = whole < 0 ? -1 : 1;
        const improper = frac(sign * (Math.abs(whole) * d + n), d);
        return { ok: true, value: improper, normalized: fracText(improper) };
      }
    }

    return {
      ok: false,
      error: CONFIG.allowMixedNumbers
        ? "Use a whole number, fraction, or mixed number, such as 2, 3/4, or 1 1/2."
        : "Use a whole number or fraction, such as 2 or 3/4."
    };
  }

  // ============================================================
  // PROBLEM CREATION
  // ============================================================
  function F(n, d) {
    const f = frac(n, d);
    return { f, text: fracText(f), html: fracHTML(f) };
  }

  function opFunc(op) {
    if (op === "+") return add;
    if (op === "-") return sub;
    if (op === "*") return mul;
    if (op === "/") return div;
    throw new Error(`Unknown operator: ${op}`);
  }

  function opHTML(op) {
    if (op === "+") return "+";
    if (op === "-") return "−";
    if (op === "*") return "×";
    if (op === "/") return "÷";
    throw new Error(`Unknown operator: ${op}`);
  }

  function makeOne(id, difficulty, A, op, B) {
    const a = F(A[0], A[1]);
    const b = F(B[0], B[1]);
    const answer = opFunc(op)(a.f, b.f);
    return {
      id,
      difficulty,
      steps: 1,
      operationSequence: [op],
      expressionText: `${a.text} ${op} ${b.text}`,
      expressionHTML: `${a.html} ${opHTML(op)} ${b.html}`,
      correctNumerator: answer.n,
      correctDenominator: answer.d,
      correctText: fracText(answer)
    };
  }

  function makeTwo(id, difficulty, A, op1, B, op2, C) {
    const a = F(A[0], A[1]);
    const b = F(B[0], B[1]);
    const c = F(C[0], C[1]);
    const mid = opFunc(op1)(a.f, b.f);
    const answer = opFunc(op2)(mid, c.f);
    return {
      id,
      difficulty,
      steps: 2,
      operationSequence: [op1, op2],
      expressionText: `(${a.text} ${op1} ${b.text}) ${op2} ${c.text}`,
      expressionHTML: `(${a.html} ${opHTML(op1)} ${b.html}) ${opHTML(op2)} ${c.html}`,
      correctNumerator: answer.n,
      correctDenominator: answer.d,
      correctText: fracText(answer)
    };
  }

  function makeThreeChain(id, difficulty, A, op1, B, op2, C, op3, D) {
    const a = F(A[0], A[1]);
    const b = F(B[0], B[1]);
    const c = F(C[0], C[1]);
    const d = F(D[0], D[1]);
    const mid1 = opFunc(op1)(a.f, b.f);
    const mid2 = opFunc(op2)(mid1, c.f);
    const answer = opFunc(op3)(mid2, d.f);
    return {
      id,
      difficulty,
      steps: 3,
      operationSequence: [op1, op2, op3],
      expressionText: `((${a.text} ${op1} ${b.text}) ${op2} ${c.text}) ${op3} ${d.text}`,
      expressionHTML: `((${a.html} ${opHTML(op1)} ${b.html}) ${opHTML(op2)} ${c.html}) ${opHTML(op3)} ${d.html}`,
      correctNumerator: answer.n,
      correctDenominator: answer.d,
      correctText: fracText(answer)
    };
  }

  function generatePracticeBank() {
    return [
      // Easy: single-operation problems
      makeOne("PRAC_E01", "easy", [1,2], "+", [1,4]),
      makeOne("PRAC_E02", "easy", [3,4], "-", [1,2]),
      makeOne("PRAC_E03", "easy", [2,3], "+", [1,6]),
      makeOne("PRAC_E04", "easy", [5,6], "-", [1,3]),
      makeOne("PRAC_E05", "easy", [2,5], "*", [3,4]),
      makeOne("PRAC_E06", "easy", [3,8], "/", [1,4]),
      makeOne("PRAC_E07", "easy", [7,10], "+", [1,5]),
      makeOne("PRAC_E08", "easy", [11,12], "-", [1,4]),
      makeOne("PRAC_E09", "easy", [4,7], "*", [7,8]),
      makeOne("PRAC_E10", "easy", [5,9], "/", [10,27]),

      // Medium: two-operation problems evaluated left to right
      makeTwo("PRAC_M01", "medium", [2,3], "+", [1,4], "*", [3,5]),
      makeTwo("PRAC_M02", "medium", [5,6], "-", [1,3], "/", [2,5]),
      makeTwo("PRAC_M03", "medium", [3,5], "+", [1,10], "*", [4,7]),
      makeTwo("PRAC_M04", "medium", [7,8], "-", [1,4], "+", [2,3]),
      makeTwo("PRAC_M05", "medium", [4,9], "*", [3,8], "+", [1,6]),

  // ============================================================
  // SIMPLE WHOLE-NUMBER CALCULATOR
  // ============================================================
  function safeCalculatorEval(expr) {
    const cleaned = String(expr || "")
      .replace(/\s/g, "")
      .replace(/×/g, "*")
      .replace(/−/g, "-")
      .trim();

    if (!cleaned) return { ok: false, error: "Enter one calculation." };

    const m = cleaned.match(/^(\d+)([+\-*÷])(\d+)$/);
    if (!m) {
      return { ok: false, error: "Enter one whole-number calculation only, e.g., 7+4 or 20÷5." };
    }

    const left = Number(m[1]);
    const op = m[2];
    const right = Number(m[3]);
    let result;

    if (op === "+") result = left + right;
    if (op === "-") result = left - right;
    if (op === "*") result = left * right;
    if (op === "÷") {
      if (right === 0) return { ok: false, error: "Cannot divide by 0." };
      result = left / right;
    }

    if (!Number.isFinite(result)) return { ok: false, error: "Invalid calculation." };
    return { ok: true, result };
  }

  function attachCalculatorHandlers() {
    const calcInput = $("calcInput");

    if (!calcInput || !calcResult || !calcBtn || !calcClear) return;

    function calculate() {
      const out = safeCalculatorEval(calcInput.value);
      if (!out.ok) {
        calcResult.innerHTML = `<span class="bad">${escapeHTML(out.error)}</span>`;
        return;
      }
      calcResult.innerHTML = `<b>${escapeHTML(String(out.result))}</b>`;
    }

    calcBtn.onclick = calculate;
    calcClear.onclick = () => {
      calcInput.value = "";
      calcResult.textContent = "";
      calcInput.focus();
    };
    calcInput.addEventListener("keydown", e => {
      if (e.key === "Enter") calculate();
    });

    document.querySelectorAll("[data-calc-key]").forEach(btn => {
      btn.onclick = () => {
        calcInput.value += btn.getAttribute("data-calc-key");
        calcInput.focus();
      };
    });

  async function collectFractionAnswer({ problem, phaseLabel, progressLabel, allowReveal = false }) {
    if (!studyTimeRemaining()) return { action: "timeout" };
    setFooter("Time remaining: " + formatClock(remainingStudyMs()), allowReveal ? "Submit or reveal answer" : "Submit an answer");

    render(html(`
      <div class="row">
        <div class="pill">${escapeHTML(progressLabel)}</div>
      </div>
      <div class="notice">
        <div class="small muted">Calculate:</div>
        <div class="math">${problem.expressionHTML}</div>
      </div>
      <div class="notice">
        <div class="small"><b>Your answer</b></div>
        <input id="answerBox" class="input" autocomplete="off" placeholder="e.g., 3/4 or 2" />
        <div id="answerErr" class="small bad" style="display:none;margin-top:8px"></div>
      </div>
      <div class="row">
        <button id="btnSubmitAnswer" class="btn">Submit answer</button>
        ${allowReveal ? '<button id="btnRevealAnswer" class="btn secondary">Reveal answer and continue</button>' : ''}
      </div>
    `));

    showCalculatorPanel();
    const answerBox = $("answerBox");
    const answerErr = $("answerErr");
    const t0 = now();
    answerBox.focus();
    restrictAnswerBox(answerBox);

    const outcome = await new Promise(resolve => {
      let resolved = false;
      let checker = null;
      function finish(value) {
        if (resolved) return;
        resolved = true;
        if (checker) window.clearInterval(checker);
        resolve(value);
      }
      function submit() {
        const parsed = parseFractionInput(answerBox.value);
        if (!parsed.ok) {
          answerErr.style.display = "block";
          answerErr.textContent = parsed.error;
          return;
        }
        finish({ action: "submitted", answerRaw: answerBox.value, parsed });
      }
      $("btnSubmitAnswer").onclick = submit;
      if (allowReveal) $("btnRevealAnswer").onclick = () => finish({ action: "revealed" });
      answerBox.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
      checker = window.setInterval(() => {
        if (!studyTimeRemaining()) {
          window.clearInterval(checker);
          finish({ action: "timeout" });
        }
      }, 200);
    });

    const rtMs = Math.round(now() - t0);
    if (outcome.action !== "submitted") {
      logEvent(`${phaseLabel}_${outcome.action}`, { problemId: problem.id, responseRTms: rtMs });
      return { ...outcome, rtMs };
    }

    const correctFrac = frac(problem.correctNumerator, problem.correctDenominator);
    const correct = sameFrac(outcome.parsed.value, correctFrac) ? 1 : 0;
    logEvent(`${phaseLabel}_answer_submitted`, { problemId: problem.id, correct, responseRTms: rtMs });
    return { ...outcome, correct, rtMs };
  }

        </div>
      </div>
      <div class="row"><button id="btnNextExposure" class="btn" disabled>Next problem</button></div>
    `));
    showCalculatorPanel();

    const action = await new Promise(resolve => {
      let done = false;
      let answerShown = false;
      let copiedCorrectly = false;
      let copiedAnswerRaw = "";
      const answerDelayMs = 10000;
      const reflectionDelayMs = 15000;
      const answerAt = t0 + answerDelayMs;
      const nextAt = answerAt + reflectionDelayMs;

      const finish = value => {
        if (done) return;
        done = true;
        window.clearInterval(checker);
        resolve(value);
      };

      $("btnNextExposure").onclick = () => {
        if (!$("btnNextExposure").disabled) finish({ action: "continued", copiedAnswerRaw });
      };

      const checker = window.setInterval(() => {
        if (!practiceTimeRemaining() || !studyTimeRemaining()) {
          finish({ action: "timeout", copiedAnswerRaw });
          return;
        }

        const current = now();
        if (!answerShown) {
          if (current >= answerAt) {
            answerShown = true;
            $("exposureStatus").style.display = "none";
            $("exposureAnswer").style.display = "block";
            const copyBox = $("exposureCopyBox");
            const copyMessage = $("exposureCopyMessage");
            restrictAnswerBox(copyBox);
            copyBox.focus();
            const evaluateCopy = () => {
              copiedAnswerRaw = copyBox.value;
              const parsed = parseFractionInput(copiedAnswerRaw);
              const correctFrac = frac(problem.correctNumerator, problem.correctDenominator);
              copiedCorrectly = Boolean(parsed.ok && sameFrac(parsed.value, correctFrac));
              copyMessage.textContent = copiedCorrectly
                ? "Answer copied correctly. Please reflect on the answer."
                : "Copy the calculated answer correctly before continuing.";
              copyMessage.className = copiedCorrectly ? "small good" : "small muted";
            };
            copyBox.addEventListener("input", evaluateCopy);
            setFooter("Time remaining: " + formatClock(remainingStudyMs()), "Copy the answer and reflect on it");
            logEvent("answer_exposure_answer_shown", {
              practiceTrialNumber,
              problemId: problem.id,
              answerRevealDelayMs: Math.round(current - t0)
            });
          }
          return;
        }

        if (current < nextAt) {
          setFooter("Time remaining: " + formatClock(remainingStudyMs()), "Please reflect on the answer");
        } else if (!copiedCorrectly) {
          setFooter("Time remaining: " + formatClock(remainingStudyMs()), "Copy the answer correctly to continue");
        } else {
          $("btnNextExposure").disabled = false;
          $("reflectionStatus").innerHTML = '<span class="good"><b>Reflection period complete.</b></span>';
          setFooter("Time remaining: " + formatClock(remainingStudyMs()), "You may continue");
        }
      }, 100);
    });

    const rtMs = Math.round(now() - t0);
    const actionName = typeof action === "string" ? action : action.action;
    const copiedAnswerRaw = typeof action === "object" ? (action.copiedAnswerRaw || "") : "";
    const copiedParsed = parseFractionInput(copiedAnswerRaw);
    const copiedCorrect = copiedParsed.ok && sameFrac(copiedParsed.value, frac(problem.correctNumerator, problem.correctDenominator)) ? 1 : 0;
    state.practiceRows.push({
      kind: "practice_trial", participantId: state.participantId, timestampISO: new Date().toISOString(),
      practiceCondition: state.practiceCondition, practiceTrialNumber, problemId: problem.id, difficulty: problem.difficulty, steps: problem.steps,
      expressionText: asciiMathText(problem.expressionText), correctTextRaw: problem.correctText, correctTextExcel: excelText(problem.correctText),
      action: actionName, attempted: 0, pressedRevealAnswer: 0, revealedAnswer: 1,
      copiedAnswerRaw, copiedAnswerRawExcel: excelText(copiedAnswerRaw), copiedAnswerCorrect: copiedCorrect,
      answerCorrect: copiedCorrect, correct: copiedCorrect,
      answerRevealDelayMs: 10000, requiredReflectionMs: 10000,
      questionTimeMs: rtMs, questionTimeSeconds: Number((rtMs / 1000).toFixed(3)), responseRTms: rtMs, elapsedStudyMs: elapsedStudyMs()
    });
    logEvent("answer_exposure_trial_end", {
      practiceTrialNumber, problemId: problem.id, action: actionName,
      copiedAnswerRaw, copiedAnswerCorrect: copiedCorrect, responseRTms: rtMs
    });
    return actionName !== "timeout";
  }

  function makeStepCard(label, index) {
    return `<div class="step-card" draggable="true" data-step-id="step-${index}" data-label="${escapeHTML(label)}">${escapeHTML(label)}</div>`;
  }

  function attachStepDragHandlers() {
    let dragged = null;
    document.querySelectorAll(".step-card").forEach(card => {
      card.addEventListener("dragstart", e => {
        dragged = card;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", card.dataset.stepId || "");
      });
      card.addEventListener("click", () => {
        const empty = Array.from(document.querySelectorAll(".step-slot")).find(slot => !slot.querySelector(".step-card"));
        if (empty && card.parentElement?.id === "stepBank") empty.appendChild(card);
      });
    });

    document.querySelectorAll(".step-slot, .step-bank").forEach(target => {
      target.addEventListener("dragover", e => { e.preventDefault(); target.classList.add("drag-over"); });
      target.addEventListener("dragleave", () => target.classList.remove("drag-over"));
      target.addEventListener("drop", e => {
        e.preventDefault();
        target.classList.remove("drag-over");
        if (!dragged) return;
        if (target.classList.contains("step-slot")) {
          const existing = target.querySelector(".step-card");
          if (existing && existing !== dragged) {
            const origin = dragged.parentElement;
            origin.appendChild(existing);
          }
          target.appendChild(dragged);
        } else {
          target.appendChild(dragged);
        }
      });
    });
  }

  async function runGuidedTableTrial(problem, practiceTrialNumber) {
    state.phase = "guided_table";
    const labelsPrefilled = practiceTrialNumber <= 3;
    const correctSequence = guidedStepSequence(problem);
    setHeader(`Guided problem ${practiceTrialNumber}`);
    setFooter("Time remaining: " + formatClock(remainingStudyMs()), labelsPrefilled ? "Steps shown in a suggested order" : "Drag the steps into the order you would use");
    logEvent("guided_table_trial_start", { practiceTrialNumber, problemId: problem.id, labelsPrefilled, correctSequenceJSON: JSON.stringify(correctSequence) });

    const rows = correctSequence.map((_, i) => `
      <tr>
        <td><div id="stepSlot${i}" class="step-slot">${labelsPrefilled ? makeStepCard(correctSequence[i], i) : ""}</div></td>
        <td><input id="stepWork${i}" class="scaffold-input" autocomplete="off" placeholder="Write your intermediate answer" /></td>
      </tr>`).join("");

    const shuffledCards = shuffledCopy(correctSequence.map((label, i) => ({ label, i })))
      .map(x => makeStepCard(x.label, x.i)).join("");

    render(html(`
      <div class="row"><div class="pill">Guided problem ${practiceTrialNumber}</div></div>
      <div class="notice"><div class="small muted">Calculate:</div><div class="math">${problem.expressionHTML}</div></div>
      ${labelsPrefilled ? "" : `<div class="notice"><div><b>Available steps</b></div><div class="small muted">Drag a step into a numbered row. You may also click a step to place it in the next empty row.</div><div id="stepBank" class="step-bank">${shuffledCards}</div></div>`}
      <div class="notice">
        <table class="scaffold-table">
          <thead><tr><th>Step order</th><th>Your intermediate answer</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="row">
        ${labelsPrefilled ? "" : '<button id="btnHint" class="btn secondary">Place next correct step</button>'}
        <button id="btnSubmitGuided" class="btn">Submit final answer</button>
      </div>
      <div id="guidedErr" class="small bad" style="display:none;margin-top:8px"></div>
    `));
    showCalculatorPanel();
    attachStepDragHandlers();
    const t0 = now();
    let hintsUsed = 0;

    if (!labelsPrefilled) {
      $("btnHint").onclick = () => {
        const slots = Array.from(document.querySelectorAll(".step-slot"));
        const nextIndex = slots.findIndex(slot => !slot.querySelector(".step-card"));
        if (nextIndex < 0) return;
        const needed = correctSequence[nextIndex];
        const card = Array.from(document.querySelectorAll("#stepBank .step-card")).find(c => c.dataset.label === needed);
        if (card) {
          slots[nextIndex].appendChild(card);
          hintsUsed += 1;
          logEvent("guided_table_hint", { practiceTrialNumber, problemId: problem.id, stepIndex: nextIndex + 1, label: needed });
        }
      };
    }

    const outcome = await new Promise(resolve => {
      let done = false;
      const finish = value => { if (!done) { done = true; clearInterval(checker); resolve(value); } };
      $("btnSubmitGuided").onclick = () => {
        const arranged = Array.from(document.querySelectorAll(".step-slot")).map(slot => slot.querySelector(".step-card")?.dataset.label || "");
        if (arranged.some(x => !x)) {
          $("guidedErr").style.display = "block";
          $("guidedErr").textContent = "Place a step in every row before submitting.";
          return;
        }
        const raw = $("stepWork" + (correctSequence.length - 1)).value;
        const parsed = parseFractionInput(raw);
        if (!parsed.ok) { $("guidedErr").style.display = "block"; $("guidedErr").textContent = "Enter your final answer in the last row before submitting."; return; }
        finish({ action: "submitted", answerRaw: raw, parsed, arranged });
      };
      const checker = setInterval(() => { if (!practiceTimeRemaining() || !studyTimeRemaining()) finish({ action: "timeout" }); }, 200);
    });

    const rtMs = Math.round(now() - t0);
    const arrangedLabels = Array.from(document.querySelectorAll(".step-slot")).map(slot => slot.querySelector(".step-card")?.dataset.label || "");
    const work = correctSequence.map((_, i) => $("stepWork" + i)?.value || "");
    let correct = "";
    if (outcome.action === "submitted") correct = sameFrac(outcome.parsed.value, frac(problem.correctNumerator, problem.correctDenominator)) ? 1 : 0;
    const orderCorrect = outcome.action === "submitted" && JSON.stringify(arrangedLabels) === JSON.stringify(correctSequence) ? 1 : 0;

    state.practiceRows.push({
      kind: "practice_trial", participantId: state.participantId, timestampISO: new Date().toISOString(),
      practiceCondition: state.practiceCondition, practiceTrialNumber, problemId: problem.id, difficulty: problem.difficulty, steps: problem.steps,
      expressionText: asciiMathText(problem.expressionText), correctTextRaw: problem.correctText, correctTextExcel: excelText(problem.correctText),
      action: outcome.action, attempted: outcome.action === "submitted" ? 1 : 0, pressedRevealAnswer: 0,
      responseRaw: outcome.action === "submitted" ? outcome.answerRaw.trim() : "",
      responseNormalizedRaw: outcome.action === "submitted" ? outcome.parsed.normalized : "",
      answerCorrect: correct, correct, stepOrderCorrect: orderCorrect, hintsUsed, labelsPrefilled: labelsPrefilled ? 1 : 0,
      correctStepSequenceJSON: JSON.stringify(correctSequence), scaffoldLabelsJSON: JSON.stringify(arrangedLabels), scaffoldWorkJSON: JSON.stringify(work),
      questionTimeMs: rtMs, questionTimeSeconds: Number((rtMs / 1000).toFixed(3)), responseRTms: rtMs, elapsedStudyMs: elapsedStudyMs()
    });

    if (outcome.action === "timeout") return false;
    await feedbackScreen({ problem, correct, responseText: outcome.parsed.normalized });
    return true;
  }

  async function runPracticeBlock() {
    const practice = generatePracticeBank();
    checkProblemBank(practice);
    state.selectedPracticeProblems = practice;
    logEvent("practice_block_start", { practiceCondition: state.practiceCondition, targetDurationMs: CONFIG.practicePhaseMs, problemIds: practice.map(p => p.id).join(";") });

    let trial = 0;
    while (practiceTimeRemaining() && studyTimeRemaining()) {
      trial += 1;
      const cycle = shuffledCopy(practice);
      for (const problem of cycle) {
        if (!practiceTimeRemaining() || !studyTimeRemaining()) break;
        let completed;
        if (state.practiceCondition === "answer_exposure") completed = await runAnswerExposureTrial(problem, trial);
        else if (state.practiceCondition === "guided_table") completed = await runGuidedTableTrial(problem, trial);
        else completed = await runPracticeTrial(problem, trial);
        if (!completed) break;
        trial += 1;
      }
      trial -= 1;
    }
    logEvent("practice_block_end", { nPracticeTrials: state.practiceRows.length, elapsedStudyMs: elapsedStudyMs() });
  }

  function flattenForCSV() {
    const rows = [];

    rows.push({
      kind: "meta",
      participantId: state.participantId,
      startedAtISO: state.startedAtISO,
      exportedAtISO: new Date().toISOString(),
      plannedDurationMs: CONFIG.totalStudyMs,
      plannedPracticeDurationMs: CONFIG.practicePhaseMs,
      elapsedStudyMs: elapsedStudyMs(),
      nPracticeTrials: state.practiceRows.length,
      nDSTTrials: state.dstPerformanceRows.length,
      notepadText: state.notepadText,
      practiceConditionNumber: state.practiceConditionNumber,
      practiceCondition: state.practiceCondition,
      practiceConditionSource: state.practiceConditionSource,
      practiceConditionError: state.practiceConditionError || "",
      practiceProblemIds: state.selectedPracticeProblems.map(p => p.id).join(";"),
      dstProblemIds: state.selectedDSTProblems.map(p => p.id).join(";")
    });

    if (state.consent) rows.push(state.consent);
    if (state.practiceRatings) rows.push(state.practiceRatings);

    for (const e of state.events) rows.push(e);
    for (const p of state.practiceRows) rows.push(p);
    for (const c of state.dstChoiceRows) rows.push(c);
    for (const d of state.dstPerformanceRows) rows.push(d);

    return rows;
  }

  function toCSV(rows) {
    if (!rows || rows.length === 0) return "";

    const headerSet = new Set();
    rows.forEach(r => Object.keys(r).forEach(k => headerSet.add(k)));

    const preferred = [
      "kind",
      "participantId",
      "timestampISO",
      "agreed",
      "startedAtISO",
      "exportedAtISO",
      "eventIndex",
      "type",
      "plannedDurationMs",
      "plannedPracticeDurationMs",
      "elapsedStudyMs",
      "notepadText",
      "practiceConditionNumber",
      "practiceCondition",
      "practiceConditionSource",
      "practiceConditionError",
      "practiceDifficulty",
      "practiceSuccess",
      "ratingsRTms",
      "ratingsTimeSeconds",
      "nPracticeTrials",
      "nDSTTrials",
      "practiceProblemIds",
      "dstProblemIds",
      "practiceTrialNumber",
      "dstTrialNumber",
      "problemId",
      "difficulty",
      "steps",
      "expressionText",
      "choice",
      "choseComplete",
      "choseGivenAnswer",
      "choiceRTms",
      "action",
      "attempted",
      "pressedRevealAnswer",
      "revealedAnswer",
      "correctTextRaw",
      "correctTextExcel",
      "correctNumerator",
      "correctDenominator",
      "responseRaw",
      "responseRawExcel",
      "responseNormalizedRaw",
      "responseNormalizedExcel",
      "responseNumerator",
      "responseDenominator",
      "answerCorrect",
      "correct",
      "questionTimeMs",
      "questionTimeSeconds",
      "responseRTms",
      "hintsUsed",
      "labelsPrefilled",
      "stepOrderCorrect",
      "correctStepSequenceJSON",
      "scaffoldLabelsJSON",
      "scaffoldWorkJSON"
    ];

    const headers = [
      ...preferred.filter(h => headerSet.has(h)),
      ...Array.from(headerSet).filter(h => !preferred.includes(h))
    ];

    const esc = (v) => {
      const s = String(v ?? "");
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };

    return "\uFEFF" + [
      headers.join(","),
      ...rows.map(r => headers.map(h => esc(r[h])).join(","))
    ].join("\n");
  }

  async function saveCSVToPipe({ experimentID, filename, csvString }) {
    const res = await fetch("https://pipe.jspsych.org/api/data/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ experimentID, filename, data: csvString })
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => "");
      throw new Error(`Pipe save failed: ${res.status} ${res.statusText} ${txt}`);
    }

    return res.json().catch(() => ({}));
  }

  function downloadText(filename, text, mime = "text/csv") {
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function buildRedirectURL() {
    if (!CONFIG.completionRedirectURL) return "";
    return CONFIG.completionRedirectURL.replaceAll("{participantId}", encodeURIComponent(state.participantId));
  }

  function redirectToCompletionURL() {
    const url = buildRedirectURL();
    if (!url) return;
    window.location.href = url;
  }

  async function endScreen({ timedOut = false } = {}) {
    if (state.saving) return;
    state.saving = true;
    state.ended = true;
    if (state.timeoutHandle) window.clearTimeout(state.timeoutHandle);
    hideCalculatorPanel();
    state.phase = "end";
    setHeader(timedOut ? "Time is up" : "Finished");
    setFooter("", "");

    const filename = `fraction-dst-sub-${state.participantId}-${Date.now()}.csv`;
    const csvString = toCSV(flattenForCSV());

    render(html(`
      <div class="notice">
        <div><b>${timedOut ? "The 15-minute study has ended." : "Study complete."}</b></div>
        <div class="small">Saving your data…</div>
        <div class="small">Please do not close this window.</div>
      </div>
    `));

    try {
      await saveCSVToPipe({
        experimentID: CONFIG.experimentID,
        filename,
        csvString
      });

      logEvent("datapipe_save_success", { filename });

      render(html(`
        <div class="notice">
          <div class="good"><b>Saved.</b></div>
          <div class="small muted">${escapeHTML(filename)}</div>
          <div class="small">You will now be redirected.</div>
        </div>
      `));

      await wait(700);
      redirectToCompletionURL();
    } catch (e) {
      console.error(e);
      const errorMessage = e instanceof Error ? e.message : String(e);
      logEvent("datapipe_save_failure", { filename, errorMessage });

      const rows = flattenForCSV();
      rows.push({
        kind: "save_error",
        participantId: state.participantId,
        timestampISO: new Date().toISOString(),
        errorMessage
      });
      const csvWithError = toCSV(rows);

      render(html(`
        <div class="notice">
          <div class="bad"><b>Upload failed.</b></div>
          <div class="small">The study is complete, but the data upload did not work.</div>
          <div class="hr"></div>
          <div class="small"><b>Error:</b> ${escapeHTML(errorMessage)}</div>
          <div class="hr"></div>
          <div class="small">Download the CSV and send it to the researcher.</div>
        </div>
        <div class="row">
          <button id="btnCsv" class="btn">Download CSV</button>
          <button id="btnRedirect" class="btn secondary">Redirect anyway</button>
        </div>
      `));

      $("btnCsv").onclick = () => downloadText(filename, csvWithError, "text/csv");
      $("btnRedirect").onclick = redirectToCompletionURL;
    }
  }

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    initStudy();

    const agreed = await consentScreen();
    if (!agreed) {
      await endNoConsentScreen();
      return;
    }

    assignPracticeCondition();
    startTimedStudy();
    await fractionInstructionsScreen();
    if (!studyTimeRemaining()) return;
    await runPracticeBlock();
    if (!studyTimeRemaining()) return;
    const ratingsCompleted = await practiceRatingsScreen();
    if (!ratingsCompleted || !studyTimeRemaining()) return;
    await dstInstructionsScreen();
    if (!studyTimeRemaining()) return;
    await runDSTBlock();
    if (!state.ended) await endScreen({ timedOut: true });
  }

  boot().catch(e => {
    console.error(e);
    hideCalculatorPanel();
    render(html(`
      <div class="notice">
        <div class="bad"><b>Unexpected error</b></div>
        <div class="small">${escapeHTML(e instanceof Error ? e.message : String(e))}</div>
      </div>
    `));
  });
})();
</script>
</body>
</html>
